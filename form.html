<!DOCTYPE html>
<html>
<head>
    <title>Startup Research Tool</title>
</head>
<body>
    <h1>Startup Research Tool</h1>
    <form method="post">
        <label>Industry:</label><br>
        <input name="industry" required><br>

        <label>Stage:</label><br>
        <input name="stage" required><br>

        <label>Region:</label><br>
        <input name="region" required><br>

        <label>Temperature (default = 0.2):</label><br>
        <input name="temperature"><br>

        <button type="submit">Fetch Startups</button>
    </form>
</body>
</html>
